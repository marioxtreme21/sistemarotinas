<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/WEB-INF/templates/layout.xhtml">

    <h:head>
        <h:outputStylesheet library="css" name="loja-remote-config.css" />
    </h:head>

    <ui:define name="title">Configuração Remota por Loja</ui:define>

    <ui:define name="content">

        <!-- ✅ Ao entrar na página (GET), fecha o formulário. Em postback não faz nada -->
        <f:event type="preRenderView" listener="#{lojaRemoteConfigBean.onPageOpen}" />

        <h:form id="frm">
            <p:growl id="msgs" showDetail="true" life="7000" autoUpdate="true" />

            <!-- Toolbar -->
            <p:toolbar styleClass="mb-3">
                <p:toolbarGroup>

                    <p:commandButton value="Novo" icon="pi pi-plus"
                        actionListener="#{lojaRemoteConfigBean.prepararNovo}"
                        process="@this" immediate="true" resetValues="true"
                        update=":frm:pnlEdicaoWrap :frm:tabela :frm:msgs" />

                    <p:commandButton value="Novo GLOBAL" icon="pi pi-plus-circle"
                        styleClass="ui-button-secondary"
                        actionListener="#{lojaRemoteConfigBean.prepararNovoGlobal}"
                        process="@this" immediate="true" resetValues="true"
                        update=":frm:pnlEdicaoWrap :frm:tabela :frm:msgs" />

                    <p:commandButton value="Salvar" icon="pi pi-save"
                        styleClass="ui-button-success"
                        actionListener="#{lojaRemoteConfigBean.salvar}"
                        process="@form"
                        update=":frm:msgs :frm:tabela :frm:pnlEdicaoWrap" />

                    <p:commandButton value="Testar conexão" icon="pi pi-plug"
                        styleClass="ui-button-info"
                        actionListener="#{lojaRemoteConfigBean.testarConexao}"
                        process="@form"
                        update=":frm:msgs" />

                </p:toolbarGroup>
            </p:toolbar>

            <!-- Wrapper SEMPRE renderizado -->
            <p:outputPanel id="pnlEdicaoWrap">
                <p:panel id="pnlEdicao"
                         header="Cadastro de Configuração Remota"
                         rendered="#{lojaRemoteConfigBean.mostrarFormulario}">
                    <div class="grid p-fluid twocol">

                        <div class="col-12">
                            <div class="twocol__check">
                                <p:selectBooleanCheckbox id="global"
                                    value="#{lojaRemoteConfigBean.globalFlag}">
                                    <p:ajax process="@this" update=":frm:pnlEdicaoWrap :frm:msgs" />
                                </p:selectBooleanCheckbox>
                                <p:outputLabel for="global"
                                    value="Configuração Global (todas as lojas)" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="loja" value="Loja: * *" />
                                <p:selectOneMenu id="loja"
                                    value="#{lojaRemoteConfigBean.selectedLojaId}"
                                    disabled="#{lojaRemoteConfigBean.globalFlag}"
                                    required="#{!lojaRemoteConfigBean.globalFlag}"
                                    requiredMessage="Loja é obrigatória quando a configuração não for global.">
                                    <f:selectItem itemLabel="-- selecione --" itemValue="#{null}" />
                                    <f:selectItems value="#{lojaRemoteConfigBean.lojas}" var="l"
                                        itemValue="#{l.lojaId}"
                                        itemLabel="#{l.lojaId} - #{l.nome}" />

                                    <p:ajax listener="#{lojaRemoteConfigBean.onSelecionarLoja}"
                                            process="@this"
                                            update=":frm:pnlEdicaoWrap :frm:msgs" />
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="proto" value="Protocolo: * *" />
                                <p:selectOneMenu id="proto"
                                    value="#{lojaRemoteConfigBean.cfg.protocolo}"
                                    required="true">
                                    <f:selectItems value="#{lojaRemoteConfigBean.protocolos}" />
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="host" value="Host remoto: * *" />
                                <p:inputText id="host"
                                    value="#{lojaRemoteConfigBean.cfg.hostRemoto}"
                                    required="true"
                                    requiredMessage="Host remoto é obrigatório." />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="porta" value="Porta: * *" />
                                <p:inputNumber id="porta"
                                    value="#{lojaRemoteConfigBean.cfg.portaRemota}"
                                    decimalPlaces="0"
                                    required="true"
                                    requiredMessage="Porta é obrigatória." />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="user" value="Usuário: * *" />
                                <p:inputText id="user"
                                    value="#{lojaRemoteConfigBean.cfg.usuarioRemoto}"
                                    required="true"
                                    requiredMessage="Usuário é obrigatório." />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="pwd" value="Senha:" />
                                <p:password id="pwd"
                                    value="#{lojaRemoteConfigBean.senhaInput}"
                                    feedback="false" toggleMask="true" redisplay="true"
                                    placeholder="(mantida se em branco)" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="key" value="Chave privada (SFTP opcional):" />
                                <p:inputText id="key"
                                    value="#{lojaRemoteConfigBean.cfg.caminhoChavePrivada}"
                                    placeholder="/caminho/para/id_rsa (se usar chave)" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="basedir" value="Diretório base remoto:" />
                                <p:inputText id="basedir"
                                    value="#{lojaRemoteConfigBean.cfg.baseDirRemoto}"
                                    placeholder="/LJ102/MARGEM ou similar" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__check">
                                <p:selectBooleanCheckbox id="passive"
                                    value="#{lojaRemoteConfigBean.cfg.ftpPassiveMode}" />
                                <p:outputLabel for="passive" value="FTP Passive Mode" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__check">
                                <p:selectBooleanCheckbox id="ftps"
                                    value="#{lojaRemoteConfigBean.cfg.ftpsTlsExplicit}" />
                                <p:outputLabel for="ftps" value="FTPS TLS Explícito" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__check">
                                <p:selectBooleanCheckbox id="valcert"
                                    value="#{lojaRemoteConfigBean.cfg.validarCertificado}" />
                                <p:outputLabel for="valcert" value="Validar Certificado" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="cto" value="Connect Timeout (ms)" />
                                <p:inputNumber id="cto"
                                    value="#{lojaRemoteConfigBean.cfg.connectTimeoutMs}"
                                    decimalPlaces="0" placeholder="20000" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="rto" value="Read Timeout (ms)" />
                                <p:inputNumber id="rto"
                                    value="#{lojaRemoteConfigBean.cfg.readTimeoutMs}"
                                    decimalPlaces="0" placeholder="30000" />
                            </div>
                        </div>

                        <div class="col-12 md:col-6">
                            <div class="twocol__row">
                                <p:outputLabel for="ret" value="Retries" />
                                <p:inputNumber id="ret"
                                    value="#{lojaRemoteConfigBean.cfg.retries}"
                                    decimalPlaces="0" placeholder="3" />
                            </div>
                        </div>

                    </div>
                </p:panel>
            </p:outputPanel>

            <p:spacer height="16" />

            <ui:include src="/resources/componentes/pesquisaLojaRemoteConfig.xhtml" />

            <p:spacer height="16" />

            <p:panel header="Configurações Cadastradas">
                <p:dataTable id="tabela"
                    value="#{lojaRemoteConfigBean.lista}"
                    var="item"
                    paginator="true" rows="10"
                    rowKey="#{item.remoteConfigId}"
                    emptyMessage="Nenhum registro.">

                    <ui:include src="/resources/componentes/dataTableLojaRemoteConfig.xhtml" />

                </p:dataTable>
            </p:panel>

        </h:form>

    </ui:define>
</ui:composition>
