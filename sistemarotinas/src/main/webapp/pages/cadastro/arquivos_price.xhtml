<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/WEB-INF/templates/layout.xhtml">

    <h:head>
        <h:outputStylesheet name="estilo.css" library="css" id="cssStileSistema" />
    </h:head>

    <ui:define name="title">Arquivos PRICE</ui:define>

    <ui:define name="content">

        <h:form id="formPesquisa">
            <ui:include src="/resources/componentes/pesquisaArquivosPrice.xhtml" />
        </h:form>

        <h:form id="formCadastroArquivosPrice">
            <p:growl id="growl" showDetail="true" life="3000" />

            <p:commandButton value="Novo Cadastro"
                             actionListener="#{arquivosPriceBean.prepararNovoCadastro}"
                             process="@this"
                             update=":formCadastroArquivosPrice:cadastroWrapper :formCadastroArquivosPrice:growl"
                             icon="pi pi-plus"
                             styleClass="ui-button-success" />

            <p:outputPanel id="cadastroWrapper">

                <p:panel id="panelCadastroArquivosPrice"
                         header="Cadastro PRICE"
                         styleClass="panelPesquisa"
                         rendered="#{arquivosPriceBean.mostrarFormulario}">

                    <p:panelGrid id="cadastroArquivosPrice"
                                 columns="2"
                                 cellpadding="10"
                                 styleClass="panelPesquisa"
                                 columnClasses="label,value">

                        <p:outputLabel for="loja" value="Loja:" />
                        <p:selectOneMenu id="loja"
                                         value="#{arquivosPriceBean.price.loja}"
                                         converter="lojaConverter"
                                         filter="true"
                                         style="width:100%">
                            <f:selectItem itemLabel="Selecione..." itemValue="#{null}" />
                            <f:selectItems value="#{arquivosPriceBean.lojas}" var="l"
                                           itemValue="#{l}" itemLabel="#{l.codLojaRms} - #{l.nome}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="subpasta" value="Subpasta Remota:" />
                        <p:inputText id="subpasta" value="#{arquivosPriceBean.price.subpastaRemota}" style="width:100%" />

                        <p:outputLabel for="tipoDest" value="Tipo de Destino:" />
                        <p:selectOneMenu id="tipoDest" value="#{arquivosPriceBean.price.tipoDestino}" style="width:100%">
                            <f:selectItem itemLabel="FS Montado" itemValue="FS"/>
                            <f:selectItem itemLabel="SFTP"       itemValue="SFTP"/>
                            <f:selectItem itemLabel="SMB"        itemValue="SMB"/>
                            <p:ajax event="change" process="@this" update="cadastroArquivosPrice" />
                        </p:selectOneMenu>

                        <p:outputLabel for="dhost" value="Dest Host (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputText id="dhost" value="#{arquivosPriceBean.price.destHost}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel for="dport" value="Dest Porta (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputNumber id="dport" value="#{arquivosPriceBean.price.destPort}" decimalPlaces="0"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel for="duser" value="Dest Usuário (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputText id="duser" value="#{arquivosPriceBean.price.destUsuario}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel value="Dest Senha (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:outputPanel rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}">

                            <p:outputPanel rendered="#{arquivosPriceBean.pricePersistido and !arquivosPriceBean.editarDestSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <!-- ✅ AJUSTE: redisplay="true" para exibir a máscara -->
                                    <p:password id="dpassMask"
                                                value="********"
                                                disabled="true"
                                                redisplay="true"
                                                feedback="false"
                                                style="width:100%" />
                                    <p:commandButton value="Alterar"
                                                     icon="pi pi-pencil"
                                                     process="@this"
                                                     actionListener="#{arquivosPriceBean.habilitarEdicaoDestSenha}"
                                                     update="cadastroArquivosPrice growl"
                                                     styleClass="ui-button-secondary" />
                                </h:panelGroup>
                            </p:outputPanel>

                            <p:outputPanel rendered="#{!arquivosPriceBean.pricePersistido or arquivosPriceBean.editarDestSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <p:password id="dpass"
                                                value="#{arquivosPriceBean.price.destSenha}"
                                                feedback="false"
                                                style="width:100%"
                                                toggleMask="true" />
                                    <p:commandButton value="Cancelar"
                                                     icon="pi pi-times"
                                                     process="@this"
                                                     actionListener="#{arquivosPriceBean.cancelarEdicaoDestSenha}"
                                                     update="cadastroArquivosPrice"
                                                     styleClass="ui-button-secondary"
                                                     rendered="#{arquivosPriceBean.pricePersistido}" />
                                </h:panelGroup>
                            </p:outputPanel>

                        </p:outputPanel>

                        <p:outputLabel for="dkey" value="Chave Privada (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputText id="dkey" value="#{arquivosPriceBean.price.destCaminhoChavePrivada}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel for="dknown" value="Known Hosts (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputText id="dknown" value="#{arquivosPriceBean.price.destKnownHostsPath}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel for="ddir" value="Dir Remoto (SFTP):"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />
                        <p:inputText id="ddir" value="#{arquivosPriceBean.price.destDirRemoto}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SFTP'}" />

                        <p:outputLabel for="fsDest" value="Caminho FS destino:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'FS'}" />
                        <p:inputText id="fsDest" value="#{arquivosPriceBean.price.caminhoFsDestino}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'FS'}" />

                        <p:outputLabel for="smbSrv" value="SMB Servidor:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbSrv" value="#{arquivosPriceBean.price.smbServidor}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbShare" value="SMB Compartilhamento:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbShare" value="#{arquivosPriceBean.price.smbCompartilhamento}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbSub" value="SMB Subpasta:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbSub" value="#{arquivosPriceBean.price.smbSubpasta}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbDom" value="SMB Domínio:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbDom" value="#{arquivosPriceBean.price.smbDominio}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbUser" value="SMB Usuário:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbUser" value="#{arquivosPriceBean.price.smbUsuario}" style="width:100%"
                                     rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />

                        <p:outputLabel value="SMB Senha:"
                                       rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}" />
                        <p:outputPanel rendered="#{arquivosPriceBean.price.tipoDestino eq 'SMB'}">

                            <p:outputPanel rendered="#{arquivosPriceBean.pricePersistido and !arquivosPriceBean.editarSmbSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <!-- ✅ AJUSTE: redisplay="true" para exibir a máscara -->
                                    <p:password id="smbPassMask"
                                                value="********"
                                                disabled="true"
                                                redisplay="true"
                                                feedback="false"
                                                style="width:100%" />
                                    <p:commandButton value="Alterar"
                                                     icon="pi pi-pencil"
                                                     process="@this"
                                                     actionListener="#{arquivosPriceBean.habilitarEdicaoSmbSenha}"
                                                     update="cadastroArquivosPrice growl"
                                                     styleClass="ui-button-secondary" />
                                </h:panelGroup>
                            </p:outputPanel>

                            <p:outputPanel rendered="#{!arquivosPriceBean.pricePersistido or arquivosPriceBean.editarSmbSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <p:password id="smbPass"
                                                value="#{arquivosPriceBean.price.smbSenha}"
                                                feedback="false"
                                                style="width:100%"
                                                toggleMask="true" />
                                    <p:commandButton value="Cancelar"
                                                     icon="pi pi-times"
                                                     process="@this"
                                                     actionListener="#{arquivosPriceBean.cancelarEdicaoSmbSenha}"
                                                     update="cadastroArquivosPrice"
                                                     styleClass="ui-button-secondary"
                                                     rendered="#{arquivosPriceBean.pricePersistido}" />
                                </h:panelGroup>
                            </p:outputPanel>

                        </p:outputPanel>

                        <p:outputLabel for="tz" value="Timezone:" />
                        <p:inputText id="tz" value="#{arquivosPriceBean.price.timezone}" style="width:100%" />

                        <p:outputLabel for="grace" value="Grace Minutes:" />
                        <p:inputNumber id="grace" value="#{arquivosPriceBean.price.graceMinutes}" decimalPlaces="0" />

                        <p:outputLabel for="verif" value="Verificação Diária Ativa:" />
                        <p:selectBooleanCheckbox id="verif" value="#{arquivosPriceBean.price.verificacaoDiariaAtiva}" />

                        <p:outputLabel for="mover" value="Mover no remoto após cópia:" />
                        <p:selectBooleanCheckbox id="mover" value="#{arquivosPriceBean.price.moverRemotoAposCopia}" />

                        <p:outputLabel for="dirProc" value="Dir remoto processed/:" />
                        <p:inputText id="dirProc" value="#{arquivosPriceBean.price.dirRemotoProcessed}" style="width:100%" />

                        <p:outputLabel for="habil" value="Habilitado:" />
                        <p:selectBooleanCheckbox id="habil" value="#{arquivosPriceBean.price.habilitado}" />

                    </p:panelGrid>

                    <p:commandButton value="Salvar"
                                     actionListener="#{arquivosPriceBean.salvar}"
                                     process="@form"
                                     update=":formCadastroArquivosPrice:cadastroWrapper :formCadastroArquivosPrice:growl :formTable:tableResult"
                                     icon="pi pi-save"
                                     styleClass="ui-button-primary" />
                </p:panel>

                <p:panel id="panelPatternsPrice"
                         header="Patterns (arquivo(s) esperado(s) no PRICE)"
                         styleClass="panelPesquisa"
                         rendered="#{arquivosPriceBean.mostrarFormulario}">
                    <ui:include src="/resources/componentes/dataTableArquivosPricePatterns.xhtml" />
                </p:panel>

            </p:outputPanel>

        </h:form>

        <h:form id="formTable">
            <p:dataTable id="tableResult"
                         value="#{arquivosPriceBean.lista}"
                         var="cfg"
                         emptyMessage="Não há registros para exibir."
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="10,20,50"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                <ui:include src="/resources/componentes/dataTableArquivosPrice.xhtml" />
            </p:dataTable>
        </h:form>

    </ui:define>
</ui:composition>
