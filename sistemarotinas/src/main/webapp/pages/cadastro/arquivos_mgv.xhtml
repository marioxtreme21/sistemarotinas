<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/WEB-INF/templates/layout.xhtml">

    <h:head>
        <h:outputStylesheet name="estilo.css" library="css" id="cssStileSistema" />
    </h:head>

    <ui:define name="title">Arquivos MGV</ui:define>

    <ui:define name="content">

        <h:form id="formPesquisa">
            <ui:include src="/resources/componentes/pesquisaArquivosMgv.xhtml" />
        </h:form>

        <h:form id="formCadastroArquivosMgv">
            <p:growl id="growl" showDetail="true" life="3000" />

            <p:commandButton value="Novo Cadastro"
                             actionListener="#{arquivosMgvBean.prepararNovoCadastro}"
                             process="@this"
                             update=":formCadastroArquivosMgv:cadastroWrapper :formCadastroArquivosMgv:growl"
                             icon="pi pi-plus"
                             styleClass="ui-button-success" />

            <p:outputPanel id="cadastroWrapper">

                <p:panel id="panelCadastroArquivosMgv"
                         header="Cadastro MGV"
                         styleClass="panelPesquisa"
                         rendered="#{arquivosMgvBean.mostrarFormulario}">

                    <p:panelGrid id="cadastroArquivosMgv"
                                 columns="2"
                                 cellpadding="10"
                                 styleClass="panelPesquisa"
                                 columnClasses="label,value">

                        <p:outputLabel for="loja" value="Loja:" />
                        <p:selectOneMenu id="loja"
                                         value="#{arquivosMgvBean.mgv.loja}"
                                         converter="lojaConverter"
                                         filter="true"
                                         style="width:100%">
                            <f:selectItem itemLabel="Selecione..." itemValue="#{null}" />
                            <f:selectItems value="#{arquivosMgvBean.lojas}" var="l"
                                           itemValue="#{l}" itemLabel="#{l.codLojaRms} - #{l.nome}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="subpasta" value="Subpasta Remota:" />
                        <p:inputText id="subpasta" value="#{arquivosMgvBean.mgv.subpastaRemota}" style="width:100%" />

                        <p:outputLabel for="tipoDest" value="Tipo de Destino:" />
                        <p:selectOneMenu id="tipoDest" value="#{arquivosMgvBean.mgv.tipoDestino}" style="width:100%">
                            <f:selectItem itemLabel="FS Montado" itemValue="FS"/>
                            <f:selectItem itemLabel="SMB"        itemValue="SMB"/>
                            <p:ajax event="change" process="@this" update="cadastroArquivosMgv" />
                        </p:selectOneMenu>

                        <!-- ===== DESTINO FS ===== -->
                        <p:outputLabel for="fsDest" value="Caminho FS destino:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'FS'}" />
                        <p:inputText id="fsDest" value="#{arquivosMgvBean.mgv.caminhoFsDestino}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'FS'}" />

                        <!-- ===== DESTINO SMB ===== -->
                        <p:outputLabel for="smbSrv" value="SMB Servidor:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbSrv" value="#{arquivosMgvBean.mgv.smbServidor}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbShare" value="SMB Compartilhamento:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbShare" value="#{arquivosMgvBean.mgv.smbCompartilhamento}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbSub" value="SMB Subpasta:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbSub" value="#{arquivosMgvBean.mgv.smbSubpasta}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbDom" value="SMB Domínio:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbDom" value="#{arquivosMgvBean.mgv.smbDominio}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />

                        <p:outputLabel for="smbUser" value="SMB Usuário:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:inputText id="smbUser" value="#{arquivosMgvBean.mgv.smbUsuario}" style="width:100%"
                                     rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />

                        <p:outputLabel value="SMB Senha:"
                                       rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}" />
                        <p:outputPanel rendered="#{arquivosMgvBean.mgv.tipoDestino eq 'SMB'}">

                            <p:outputPanel rendered="#{arquivosMgvBean.mgvPersistido and !arquivosMgvBean.editarSmbSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <p:password id="smbPassMask"
                                                value="********"
                                                disabled="true"
                                                redisplay="true"
                                                feedback="false"
                                                style="width:100%" />
                                    <p:commandButton value="Alterar"
                                                     icon="pi pi-pencil"
                                                     process="@this"
                                                     actionListener="#{arquivosMgvBean.habilitarEdicaoSmbSenha}"
                                                     update="cadastroArquivosMgv growl"
                                                     styleClass="ui-button-secondary" />
                                </h:panelGroup>
                            </p:outputPanel>

                            <p:outputPanel rendered="#{!arquivosMgvBean.mgvPersistido or arquivosMgvBean.editarSmbSenha}">
                                <h:panelGroup layout="block" style="display:flex;gap:8px;align-items:center;">
                                    <p:password id="smbPass"
                                                value="#{arquivosMgvBean.mgv.smbSenha}"
                                                feedback="false"
                                                style="width:100%"
                                                toggleMask="true" />
                                    <p:commandButton value="Cancelar"
                                                     icon="pi pi-times"
                                                     process="@this"
                                                     actionListener="#{arquivosMgvBean.cancelarEdicaoSmbSenha}"
                                                     update="cadastroArquivosMgv"
                                                     styleClass="ui-button-secondary"
                                                     rendered="#{arquivosMgvBean.mgvPersistido}" />
                                </h:panelGroup>
                            </p:outputPanel>

                        </p:outputPanel>

                        <!-- ===== CONTROLES PADRÃO ===== -->
                        <p:outputLabel for="tz" value="Timezone:" />
                        <p:inputText id="tz" value="#{arquivosMgvBean.mgv.timezone}" style="width:100%" />

                        <p:outputLabel for="grace" value="Grace Minutes:" />
                        <p:inputNumber id="grace" value="#{arquivosMgvBean.mgv.graceMinutes}" decimalPlaces="0" />

                        <p:outputLabel for="verif" value="Verificação Diária Ativa:" />
                        <p:selectBooleanCheckbox id="verif" value="#{arquivosMgvBean.mgv.verificacaoDiariaAtiva}" />

                        <p:outputLabel for="mover" value="Mover no remoto após cópia:" />
                        <p:selectBooleanCheckbox id="mover" value="#{arquivosMgvBean.mgv.moverRemotoAposCopia}" />

                        <p:outputLabel for="dirProc" value="Dir remoto processed/:" />
                        <p:inputText id="dirProc" value="#{arquivosMgvBean.mgv.dirRemotoProcessed}" style="width:100%" />

                        <p:outputLabel for="habil" value="Habilitado:" />
                        <p:selectBooleanCheckbox id="habil" value="#{arquivosMgvBean.mgv.habilitado}" />

                    </p:panelGrid>

                    <p:commandButton value="Salvar"
                                     actionListener="#{arquivosMgvBean.salvar}"
                                     process="@form"
                                     update=":formCadastroArquivosMgv:cadastroWrapper :formCadastroArquivosMgv:growl :formTable:tableResult"
                                     icon="pi pi-save"
                                     styleClass="ui-button-primary" />

                    <p:commandButton value="Testar"
                                     icon="pi pi-play"
                                     styleClass="ui-button-secondary"
                                     rendered="#{arquivosMgvBean.mgvPersistido}"
                                     actionListener="#{arquivosMgvBean.testarAtual}"
                                     process="@this"
                                     update=":formCadastroArquivosMgv:growl"
                                     onclick="if(!confirm('Deseja executar o teste de transferência agora?')) return false;" />

                </p:panel>

                <p:panel id="panelPatternsMgv"
                         header="Patterns (arquivo(s) esperado(s) no MGV)"
                         styleClass="panelPesquisa"
                         rendered="#{arquivosMgvBean.mostrarFormulario}">
                    <ui:include src="/resources/componentes/dataTableArquivosMgvPatterns.xhtml" />
                </p:panel>

            </p:outputPanel>

        </h:form>

        <h:form id="formTable">
            <p:dataTable id="tableResult"
                         value="#{arquivosMgvBean.lista}"
                         var="cfg"
                         emptyMessage="Não há registros para exibir."
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="10,20,50"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                <ui:include src="/resources/componentes/dataTableArquivosMgv.xhtml" />
            </p:dataTable>
        </h:form>

    </ui:define>
</ui:composition>
