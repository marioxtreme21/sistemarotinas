<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- Aviso visual quando ainda não salvou a configuração PRICE -->
    <h:panelGroup rendered="#{!arquivosPriceBean.pricePersistido}">
        <h:outputText
            value="⚠ Salve a configuração PRICE antes de adicionar patterns."
            style="display:block;margin:6px 0 10px 0;color:#a94442;font-weight:bold;" />
    </h:panelGroup>

    <p:panelGrid id="gridAddPattern"
                 columns="4"
                 columnClasses="label,value,label,value"
                 cellpadding="8">

        <p:row>
            <p:column>
                <p:outputLabel for="patt" value="Pattern:" />
            </p:column>
            <p:column>
                <p:inputText id="patt"
                             value="#{arquivosPriceBean.novoPattern.pattern}"
                             disabled="#{!arquivosPriceBean.pricePersistido}"
                             style="width: 260px;" />
            </p:column>

            <p:column>
                <p:outputLabel for="req" value="Obrigatório:" />
            </p:column>
            <p:column>
                <p:selectBooleanCheckbox id="req"
                                        value="#{arquivosPriceBean.novoPattern.required}"
                                        disabled="#{!arquivosPriceBean.pricePersistido}" />
            </p:column>
        </p:row>

        <p:row>
            <p:column colspan="4" style="padding-top:6px;">
                <p:commandButton value="Adicionar Pattern"
                                 icon="pi pi-plus"
                                 actionListener="#{arquivosPriceBean.adicionarPattern}"
                                 process="@this gridAddPattern"
                                 update=":formCadastroArquivosPrice:gridAddPattern
                                         :formCadastroArquivosPrice:patternsTable
                                         :formCadastroArquivosPrice:growl"
                                 disabled="#{!arquivosPriceBean.pricePersistido}"
                                 styleClass="ui-button-success" />
            </p:column>
        </p:row>

    </p:panelGrid>

    <p:dataTable id="patternsTable"
                 value="#{arquivosPriceBean.patternsDaLoja}"
                 var="pt"
                 emptyMessage="Nenhum pattern cadastrado."
                 rows="5"
                 paginator="true"
                 rowsPerPageTemplate="5,10">

        <p:column headerText="Pattern">
            <h:outputText value="#{pt.pattern}" />
        </p:column>

        <p:column headerText="Obrigatório" style="width:120px;">
            <h:outputText value="#{pt.required ? 'Sim' : 'Não'}" />
        </p:column>

        <p:column headerText="Ações" style="width:140px;">
            <p:commandButton value="Remover"
                             icon="pi pi-trash"
                             onclick="return confirm('Remover pattern?')"
                             actionListener="#{arquivosPriceBean.removerPattern(pt.patternId)}"
                             process="@this"
                             update=":formCadastroArquivosPrice:patternsTable
                                     :formCadastroArquivosPrice:growl" />
        </p:column>

    </p:dataTable>

</ui:composition>
