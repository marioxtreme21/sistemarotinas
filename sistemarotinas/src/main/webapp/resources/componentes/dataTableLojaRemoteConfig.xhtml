<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- Escopo -->
    <p:column headerText="Escopo">
        <h:panelGroup rendered="#{empty item.loja}">
            <h:outputText value="-" />
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty item.loja}">
            <h:outputText value="#{item.loja.lojaId}" />
            <h:outputText value=" - " />
            <h:outputText value="#{item.loja.nome}" />
        </h:panelGroup>
    </p:column>

    <p:column headerText="Protocolo">
        <h:outputText value="#{item.protocolo}" />
    </p:column>

    <p:column headerText="Host">
        <h:outputText value="#{item.hostRemoto}" />
    </p:column>

    <p:column headerText="Porta" style="width:80px;text-align:center">
        <h:outputText value="#{item.portaRemota}" />
    </p:column>

    <p:column headerText="Base Dir">
        <h:outputText value="#{item.baseDirRemoto}" />
    </p:column>

    <p:column headerText="Ações" style="width:160px;text-align:center">

        <p:commandButton icon="pi pi-pencil" title="Editar"
                         actionListener="#{lojaRemoteConfigBean.editar(item)}"
                         process="@this" immediate="true" resetValues="true"
                         update=":frm:pnlEdicaoWrap :frm:msgs"/>

        <p:commandButton icon="pi pi-trash" title="Excluir" styleClass="ui-button-danger"
                         actionListener="#{lojaRemoteConfigBean.excluir(item.remoteConfigId)}"
                         process="@this"
                         update=":frm:tabela :frm:msgs"/>

        <p:commandButton icon="pi pi-plug" title="Testar"
                         actionListener="#{lojaRemoteConfigBean.testarConexao(item)}"
                         process="@this"
                         update=":frm:msgs"/>
    </p:column>

</ui:composition>
