<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <h:outputStylesheet name="estilo.css" library="css"
            id="cssStileSistema" />
    </h:head>

    <h:form id="formPesquisaTara">
        <p:panel header="Pesquisa de Tara" styleClass="panelPesquisa">
            <p:spacer />

            <p:panelGrid id="panelGridPesquisaTara" columns="4" cellpadding="5">

                <p:row>
                    <p:outputLabel for="campoPesquisa" value="Campo:" />
                    <p:selectOneMenu id="campoPesquisa"
                        value="#{taraBean.campoSelecionado}" style="width: 100%;">
                        <f:selectItem itemLabel="Selecione um campo" itemValue="" />
                        <f:selectItems value="#{taraBean.camposPesquisa}" var="campo"
                            itemLabel="#{campo.label}" itemValue="#{campo.value}" />
                    </p:selectOneMenu>
                </p:row>

                <p:row>
                    <p:outputLabel for="condicaoPesquisa" value="Condição:" />
                    <p:selectOneMenu id="condicaoPesquisa"
                        value="#{taraBean.condicaoSelecionada}" style="width: 100%;">
                        <f:selectItem itemLabel="Selecione uma condição" itemValue="" />
                        <f:selectItem itemLabel="Igual" itemValue="equal" />
                        <f:selectItem itemLabel="Contém" itemValue="contains" />
                    </p:selectOneMenu>
                </p:row>

                <p:row>
                    <p:outputLabel for="valorPesquisa" value="Valor:" />
                    <p:inputText id="valorPesquisa" value="#{taraBean.valorPesquisa}"
                        style="width: 100%;" />
                </p:row>

                <p:row>
                    <p:outputLabel />
                    <p:commandButton value="Pesquisar" icon="pi pi-search"
                        actionListener="#{taraBean.pesquisar}" update="@form"
                        ajax="false" immediate="false"
                        process="@this,panelGridPesquisaTara"
                        styleClass="ui-button-primary" style="width: 100%;" />
                </p:row>

                <p:row>
                    <p:outputLabel />
                    <p:commandButton value="Limpar Filtros" icon="pi pi-times"
                        actionListener="#{taraBean.limparFiltros}" update="@form"
                        ajax="false" immediate="false"
                        process="@this,panelGridPesquisaTara"
                        styleClass="ui-button-secondary" style="width: 100%;" />
                </p:row>

            </p:panelGrid>
        </p:panel>
    </h:form>
</ui:composition>
